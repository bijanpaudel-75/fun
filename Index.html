<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Game Portal</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-bottom: 30px;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1000px;
        }

        .game-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: transform 0.3s ease, border-color 0.3s ease;
            border: 2px solid transparent;
            text-decoration: none;
            color: inherit;
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-color);
        }

        .game-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
            background: #334155;
        }

        .game-card h2 {
            margin: 10px 0;
            font-size: 1.25rem;
        }

        .game-card p {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .play-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 8px 20px;
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
            border-radius: 20px;
            transition: opacity 0.2s;
        }

        .play-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <h1> My game corner </h1>

    <div class="game-grid">

      <span>currently no game's are available.</span>
        
        </div>

</body>
</html>
